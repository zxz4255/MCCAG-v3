name: Build Website Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install -g pnpm
          pnpm install --dangerously-allow-all-builds

      - name: Build and create deployment package
        run: |
          # 构建项目
          pnpm run build

          # 创建临时目录
          mkdir -p /tmp/deploy-temp

          # 复制构建产物
          rsync -rlptgoD \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='build.js' \
            --exclude='vite.config.js' \
            --exclude='README.md' \
            --exclude='package.json' \
            --exclude='pnpm-lock.yaml' \
            dist/ /tmp/deploy-temp/

          # 创建压缩包
          tar -czf website-deploy.tar.gz -C /tmp/deploy-temp .

          # 查看内容
          echo "Deployment package:"
          tar -tzf website-deploy.tar.gz | head -50

          # 清理
          rm -rf /tmp/deploy-temp

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: website-deploy
          path: website-deploy.tar.gz
          retention-days: 30
