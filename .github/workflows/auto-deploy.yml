name: Auto Deploy via SSH

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install -g pnpm
          pnpm install --dangerously-allow-all-builds

      - name: Build and create deployment package
        run: |
          # 构建项目
          pnpm run build

          # 创建临时目录
          mkdir -p /tmp/deploy-temp

          # 复制构建产物
          rsync -rlptgoD \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='build.js' \
            --exclude='vite.config.js' \
            --exclude='README.md' \
            --exclude='package.json' \
            --exclude='pnpm-lock.yaml' \
            .dist/ /tmp/deploy-temp/

          # 打包
          tar -czf website-deploy.tar.gz -C /tmp/deploy-temp .

          # 查看包内容
          echo "Deployment package:"
          tar -tzf website-deploy.tar.gz | head -50

          # 清理
          rm -rf /tmp/deploy-temp

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: website-deploy
          path: website-deploy.tar.gz
          retention-days: 30

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          scp -o StrictHostKeyChecking=no \
            website-deploy.tar.gz \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/

          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
              set -e

              cd /www/wwwroot/Website

              rm -f *.css *.js

              tar -xzf /tmp/website-deploy.tar.gz

              rm -f /tmp/website-deploy.tar.gz

              echo 'Deploy completed!'
            "
